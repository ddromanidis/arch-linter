version: 1

global:
  allow:
    - "fmt"
    - "errors"
    - "time"
    - "context"
    - "github.com/sirupsen/logrus" # Allowed everywhere for logging
  deny:
    - "reflect" # Too much magic
    - "unsafe"  # Safety first
    - "github.com/bad/lib"

modules:
  - name: models
    path: "internal/models"
    description: "Core entities and business rules."
    imports: ["time"]
    exports: ["time"]

  - name: application
    path: "internal/application"
    description: "Use cases and application logic."
    imports: ["models", "errors"]
    exports: ["models"]

  - name: infrastructure
    path: "internal/infrastructure"
    description: "Database clients, external services."
    imports:
      - "application"
      - "models"
      - "gorm.io/gorm"
      - "github.com/jackc/pgx"
    exports: ["application", "models"]

  - name: api
    path: "internal/api"
    description: "HTTP handlers and API models."
    imports:
      - "application"
      - "models"
      - "github.com/gin-gonic/gin"
      - "net/http"
    exports: ["application", "models"]

  - name: cmd
    path: "cmd"
    description: "Main application entry points."
    imports:
      - "application"
      - "models"
      - "infrastructure"
      - "api"
      - "github.com/sirupsen/logrus"
    exports: ["application", "models", "infrastructure", "api"]
