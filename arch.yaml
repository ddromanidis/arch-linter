version: 1

# archlint's own architecture. The tool has to be able to describe itself, or it is not
# describing much.
components:
  config:
    path: config/...
    description: "Parses arch.yaml and arch.config.yaml. Knows nothing about Go code."
    imports: [gopkg.in/yaml.v3, bytes]
    exports: []

  analyzer:
    path: analyzer/...
    description: "The two rules, as an analysis.Analyzer."
    imports: [config, golang.org/x/tools/go/analysis, go/types, go/token, reflect]
    # Exposing analysis and config is deliberate: the golangci-lint plugin needs both.
    # Violation carries a token.Pos, so go/token is part of the surface.
    exports: [config, golang.org/x/tools/go/analysis, go/token]

  baseline:
    path: internal/baseline/...
    description: "Freezes today's violations so a rule can be switched on before the code obeys it."
    imports: [report, gopkg.in/yaml.v3, bytes]
    exports: [report]

  diagram:
    path: internal/diagram/...
    description: "Renders arch.yaml as a Mermaid graph."
    imports: [config]
    # Mermaid writes to an io.Writer. A stdlib interface in a signature is not the kind
    # of leak this rule is for; the rule is for driver handles.
    exports: [config, io]

  scaffold:
    path: internal/scaffold/...
    description: "Writes a starting arch.yaml."
    imports: []
    exports: []

  report:
    path: internal/report/...
    description: "Findings to text, json, github, sarif."
    imports: []
    # io.Writer in Write's signature. Exporting a stdlib interface is not a leak worth
    # forbidding; the rule exists to catch driver handles, not io.
    exports: [io]

  driver:
    path: internal/run/...
    description: "Loads packages and runs the analyzer over them."
    imports:
      - analyzer
      - config
      - report
      - golang.org/x/tools/go/analysis
      - golang.org/x/tools/go/packages
    # The driver hands out Rules and a packages.LoadMode, so both are part of its surface.
    exports: [report, analyzer, golang.org/x/tools/go/packages]

  cli:
    path: cmd/...
    description: "The command. May reach everything; nothing may reach it."
    imports:
      - analyzer
      - config
      - report
      - driver
      - baseline
      - diagram
      - scaffold
      - golang.org/x/term
      # cmd/archlint-vet is a unitchecker, so `go vet` can drive the same rules.
      - golang.org/x/tools/go/analysis/singlechecker
    exports: []

defaults:
  imports: [fmt, errors, os, io, strings, sort, path, path/filepath, sync, strconv, flag, encoding/json]
  exports: []
